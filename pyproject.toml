[tool.ruff]
target-version = "py312"
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"api/main.py" = ["E402"]
"evaluation/benchmark.py" = ["E402"]
"scripts/*.py" = ["E402"]

[tool.pytest.ini_options]
# Evidence folders under docs/ keep copied source trees, including test files.
# Collect only the real suite so a bare `pytest` works from the repo root.
testpaths = ["tests"]
norecursedirs = ["docs", "archive", "frontend", "frontend-v1", "node_modules", ".venv", ".git"]
