# Default local service: PostgreSQL with pgvector.
name: ocean-platform

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ocean_pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: ocean
      POSTGRES_PASSWORD: ocean
      POSTGRES_DB: ocean_platform
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
