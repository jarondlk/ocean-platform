version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    # Routine upgrades stay within compatible release lines. Security updates
    # remain eligible regardless of this version-update allowlist.
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      python-routine:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      frontend-routine:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      frontend-security:
        applies-to: security-updates
        patterns:
          - "*"
    # Routine version updates stay on compatible releases. GitHub documents
    # that this allowlist does not restrict Dependabot security updates.
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    # Python runtime upgrades require coordinated CI, dependency-wheel, and
    # deployment validation. Continue accepting patch and digest refreshes for
    # the supported 3.12 line.
    ignore:
      - dependency-name: "python"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    # Keep the production image aligned with the Node 22 CI/runtime baseline.
    # Runtime-line upgrades are handled as explicit migration work.
    ignore:
      - dependency-name: "node"
        update-types:
          - version-update:semver-major
