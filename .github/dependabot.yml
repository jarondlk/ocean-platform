version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    # requirements.txt currently uses lower bounds rather than a lock file.
    # Routine version PRs only raise those floors and do not make fresh
    # installations more current, so keep Dependabot focused on vulnerabilities.
    open-pull-requests-limit: 0
    groups:
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      frontend-routine:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      frontend-security:
        applies-to: security-updates
        patterns:
          - "*"
    # Routine version updates stay on compatible releases. GitHub documents
    # that this allowlist does not restrict Dependabot security updates.
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
