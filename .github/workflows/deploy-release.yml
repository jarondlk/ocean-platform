name: Deploy release
run-name: "${{ inputs.mode }} ${{ inputs.release_tag }}"

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Published stable release tag (for example v0.4.5)"
        required: true
        type: string
      mode:
        description: "Verify access and compatibility, or build and deploy"
        required: true
        default: verify
        type: choice
        options:
          - verify
          - deploy

permissions:
  contents: read

concurrency:
  group: ocean-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Validate and deploy selected release
    runs-on: ubuntu-latest
    timeout-minutes: 100
    environment:
      name: production
      url: https://oceaninfobio.com
    permissions:
      contents: read
      id-token: write
      deployments: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out trusted deployment tooling and release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: data-infra-infobio
          workload_identity_provider: ${{ vars.GCP_RELEASE_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_RELEASE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 3600s

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Validate published release, live settings, and data compatibility
        env:
          CLOUDSDK_AUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python3 scripts/deploy_release.py preflight --tag "$RELEASE_TAG" --state-dir "$RUNNER_TEMP/ocean-release"

      - name: Build and test exact release source
        if: inputs.mode == 'deploy'
        timeout-minutes: 47
        env:
          CLOUDSDK_AUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python3 scripts/deploy_release.py build --state-dir "$RUNNER_TEMP/ocean-release"

      # Obtain a new token after the build, so deployment has its own full lifetime.
      - name: Renew deployment credentials
        if: inputs.mode == 'deploy'
        id: deploy-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: data-infra-infobio
          workload_identity_provider: ${{ vars.GCP_RELEASE_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_RELEASE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 3600s

      - name: Back up, validate candidate, and promote production
        if: inputs.mode == 'deploy'
        timeout-minutes: 45
        env:
          CLOUDSDK_AUTH_ACCESS_TOKEN: ${{ steps.deploy-auth.outputs.access_token }}
        run: python3 scripts/deploy_release.py deploy --state-dir "$RUNNER_TEMP/ocean-release"

      - name: Record deployment against the release commit
        if: inputs.mode == 'deploy'
        run: python3 scripts/deploy_release.py record --state-dir "$RUNNER_TEMP/ocean-release"

      - name: Recover interrupted promotion when possible
        if: (failure() || cancelled()) && inputs.mode == 'deploy' && steps.deploy-auth.outcome == 'success'
        env:
          CLOUDSDK_AUTH_ACCESS_TOKEN: ${{ steps.deploy-auth.outputs.access_token }}
        run: python3 scripts/deploy_release.py rollback --state-dir "$RUNNER_TEMP/ocean-release"
