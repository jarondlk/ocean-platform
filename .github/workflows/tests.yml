name: CI

on:
  push:
    branches: [main, master, gcp-dev]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and security boundary
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/runtime.in
            requirements/runtime.txt
            requirements/dev.in
            requirements/dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/dev.txt

      - name: Lint active Python code
        run: |
          python -m ruff check \
            api \
            config.py \
            db \
            evaluation \
            ingestion \
            orchestration \
            preprocessing \
            retrieval \
            schema \
            scripts \
            tests

      - name: Run tests with coverage
        env:
          AUTH_MODE: disabled
          DEPLOYMENT_ENV: test
          ENABLE_MOCK_LOGIN: "false"
          PERSIST_LOCAL_CHAT: "false"
        run: |
          python -m pytest tests/ -q --tb=short \
            --cov=api \
            --cov=config \
            --cov=db \
            --cov=preprocessing \
            --cov=ingestion \
            --cov=orchestration \
            --cov=schema \
            --cov=evaluation \
            --cov-report=term-missing \
            --cov-fail-under=70

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit production frontend dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        env:
          DEPLOYMENT_ENV: test
          AUTH_MODE: required
          ENABLE_MOCK_LOGIN: "false"
          AUTH_SECRET: ci-only-auth-secret-that-is-long-enough
          INTERNAL_AUTH_SECRET: ci-only-internal-secret-that-is-long-enough
        run: npm run build

  postgres-integration:
    name: PostgreSQL migration and metadata integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: onagawa
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_DB: onagawa_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onagawa -d onagawa_rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/runtime.in
            requirements/runtime.txt
            requirements/dev.in
            requirements/dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/dev.txt

      - name: Apply application migrations
        env:
          DATABASE_URL: postgresql://onagawa:integration-only-password@127.0.0.1:5432/onagawa_rag
        run: python -m alembic upgrade head

      - name: Verify invite acceptance and metadata persistence
        env:
          AUTH_MODE: disabled
          DEPLOYMENT_ENV: test
          DATABASE_URL: postgresql://onagawa:integration-only-password@127.0.0.1:5432/onagawa_rag
          RUN_POSTGRES_INTEGRATION: "1"
        run: >-
          python -m pytest
          tests/integration/test_app_metadata_postgres.py
          tests/integration/test_operational_postgres.py
          -q

      - name: Verify transactional corpus upsert is idempotent
        env:
          DATABASE_URL: postgresql://onagawa:integration-only-password@127.0.0.1:5432/onagawa_rag
        run: |
          python scripts/load_db.py --upsert --json
          python scripts/load_db.py --upsert --json

      - name: Verify database backup and isolated restore
        env:
          DATABASE_URL: postgresql://onagawa:integration-only-password@127.0.0.1:5432/onagawa_rag
          DATABASE_BACKUP_CONTAINER: ""
        run: >-
          python scripts/database_backup.py create
          --output-dir "${RUNNER_TEMP}/database-backup"
          --label ci
          --restore-test

  dependency-review:
    name: Dependency review
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.repository.private == false ||
      vars.GH_CODE_SECURITY_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
