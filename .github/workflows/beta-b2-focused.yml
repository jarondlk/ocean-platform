name: Beta B2 data and catalogue qualification

on:
  push:
    branches: [overhaul]
    paths:
      - 'ingestion/edna_catalogue_inputs.py'
      - 'ingestion/edna_input_cache.py'
      - 'ingestion/gcs_catalogue_snapshot.py'
      - 'orchestration/frozen_edna_catalogue.py'
      - 'orchestration/frozen_scientific_catalogue.py'
      - 'orchestration/catalogue_service.py'
      - 'api/v1_catalogue_host.py'
      - 'deploy/gcp/beta/data/**'
      - 'tests/test_edna_input_cache.py'
      - 'tests/test_edna_validation_reuse.py'
      - 'tests/test_beta_edna_cached_host.py'
      - 'tests/test_beta_research_catalogue_append.py'
      - 'tests/test_beta_research_edna_preparation.py'
      - 'tests/test_beta_append_revision_compatibility.py'
      - 'tests/integration/test_beta_b2_retained_append_postgres.py'
      - 'tests/test_gcs_catalogue_snapshot.py'
      - '.github/workflows/beta-b2-focused.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-b2-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalogue:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ocean
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_DB: ocean_b2_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ocean -d ocean_b2_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTH_MODE: disabled
      DEPLOYMENT_ENV: test
      DATABASE_URL: postgresql://ocean:integration-only-password@127.0.0.1:5432/ocean_b2_disposable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements/dev.txt
      - name: Check changed sources
        run: >-
          python -m ruff check ingestion/edna_catalogue_inputs.py
          ingestion/edna_input_cache.py ingestion/gcs_catalogue_snapshot.py
          orchestration/frozen_edna_catalogue.py orchestration/catalogue_service.py
          orchestration/frozen_scientific_catalogue.py
          api/v1_catalogue_host.py deploy/gcp/beta/data/append_catalogue.py
          deploy/gcp/beta/data/publish_append.py tests/test_edna_input_cache.py
          tests/test_edna_validation_reuse.py tests/test_beta_edna_cached_host.py
          tests/test_beta_research_catalogue_append.py tests/test_gcs_catalogue_snapshot.py
          tests/test_beta_catalogue_append.py
          deploy/gcp/beta/data/prepare_research_edna.py
          tests/test_beta_research_edna_preparation.py tests/test_beta_append_revision_compatibility.py
          tests/integration/test_beta_b2_retained_append_postgres.py
      - name: Verify input semantics, current authority and Research-preserving publication
        run: >-
          python -m pytest -q --tb=short
          tests/test_edna_input_cache.py tests/test_edna_validation_reuse.py
          tests/test_edna_catalogue_inputs.py tests/test_edna_catalogue_adversarial.py
          tests/test_frozen_edna_catalogue.py tests/test_gcs_catalogue_snapshot.py
          tests/test_v1_catalogue_host.py tests/test_beta_snapshot_catalogue.py
          tests/test_beta_multisource_edna_catalogue.py tests/test_beta_edna_cached_host.py
          tests/test_beta_catalogue_append.py tests/test_beta_catalogue_publish_append.py
          tests/test_beta_research_catalogue_append.py tests/test_catalogue_service.py
          tests/test_catalogue_service_frozen.py tests/test_catalogue_service_materialization.py
          tests/test_frozen_scientific_catalogue.py
          tests/test_beta_research_edna_preparation.py tests/test_beta_append_revision_compatibility.py
          tests/test_research_evidence_store.py tests/test_research_evidence_runtime.py
      - name: Verify actual PostgreSQL 16 canonical SQL versus frozen C12 predicates
        env:
          RUN_POSTGRES_INTEGRATION: '1'
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url
          target = make_url(os.environ['DATABASE_URL'])
          assert (target.host, target.port, target.database, target.username) == (
              '127.0.0.1', 5432, 'ocean_b2_disposable', 'ocean')
          engine = create_engine(target)
          with engine.begin() as connection:
              database, version = connection.execute(text(
                  "SELECT current_database(), current_setting('server_version_num')")).one()
              assert database == 'ocean_b2_disposable' and 160000 <= int(version) < 170000
              connection.execute(text('CREATE EXTENSION IF NOT EXISTS vector'))
          engine.dispose()
          print('Job-owned disposable PostgreSQL16 pgvector fixture initialized; no beta target used')
          PY
          python -m pytest tests/integration/test_edna_catalogue_postgres.py -q -rA --tb=short
      - name: Select job-owned PostgreSQL peer for retained-evidence tests
        id: b2-pg-peer
        env:
          POSTGRES_TEST_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          address="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$POSTGRES_TEST_CONTAINER_ID")"
          python -c 'import ipaddress,sys; ipaddress.IPv4Address(sys.argv[1])' "$address"
          printf 'address=%s\n' "$address" >> "$GITHUB_OUTPUT"
      - name: Verify retained C21 evidence after unrelated append on actual PostgreSQL16
        env:
          RUN_POSTGRES_INTEGRATION: '1'
          C21_TEST_DATABASE_URL: postgresql://ocean:integration-only-password@127.0.0.1:5432/ocean_c21_beta_b2_test
          C21_TEST_SERVER_ADDRESS: ${{ steps.b2-pg-peer.outputs.address }}
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url
          target = make_url(os.environ['DATABASE_URL'])
          assert (target.host, target.port, target.database) == ('127.0.0.1', 5432, 'ocean_b2_disposable')
          engine = create_engine(target, isolation_level='AUTOCOMMIT')
          with engine.connect() as connection:
              assert connection.scalar(text('SELECT current_database()')) == 'ocean_b2_disposable'
              assert not connection.scalar(text("SELECT EXISTS (SELECT 1 FROM pg_database WHERE datname='ocean_c21_beta_b2_test')"))
              connection.exec_driver_sql('CREATE DATABASE ocean_c21_beta_b2_test')
          engine.dispose()
          PY
          python -m pytest tests/integration/test_beta_b2_retained_append_postgres.py -q -rA --tb=short
