          -x -vv -s --tb=short -o faulthandler_timeout=0

      - name: Verify database backup and isolated restore
        env:
          DATABASE_URL: postgresql://ocean:integration-only-password@127.0.0.1:5432/ocean_platform
          DATABASE_BACKUP_CONTAINER: ""
        run: |
          # Match client tools to the PostgreSQL 16 service. Newer pg_restore
          # versions can emit settings that PostgreSQL 16 cannot restore.
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          pg_dump --version | grep -E 'PostgreSQL\) 16\.'
          pg_restore --version | grep -E 'PostgreSQL\) 16\.'
          python scripts/database_backup.py create \
          --output-dir "${RUNNER_TEMP}/database-backup" \
