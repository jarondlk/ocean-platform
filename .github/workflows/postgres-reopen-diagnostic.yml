name: PostgreSQL native reopen diagnostic

on:
  push:
    branches: ['codex/postgres-reopen-20261111']

permissions:
  contents: read

concurrency:
  group: postgres-reopen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused-timer120:
    name: Focused native reopen with timer 120
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ocean
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_DB: ocean_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ocean -d ocean_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout immutable application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: 0f15bbcae3ad73ed76ddb32dd57b3a03dbedb49f

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/runtime.in
            requirements/runtime.txt
            requirements/dev.in
            requirements/dev.txt

      - name: Install original locked test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/dev.txt

      - name: Record exact interpreter, driver and PostgreSQL identities
        env:
          POSTGRES_TEST_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          python -VV
          python -m pip show pytest pytest-cov coverage pydantic psycopg2-binary sqlalchemy
          /usr/lib/postgresql/16/bin/pg_dump --version
          /usr/lib/postgresql/16/bin/pg_restore --version
          docker inspect --format '{{.Image}}' "$POSTGRES_TEST_CONTAINER_ID"
          python - <<'PYTEST'
          import platform
          import sys
          from sqlalchemy import create_engine, text
          assert sys.version_info[:2] == (3, 12)
          print('Interpreter architecture:', platform.machine())
          engine = create_engine('postgresql://ocean:integration-only-password@127.0.0.1:5432/ocean_platform', isolation_level='AUTOCOMMIT')
          with engine.connect() as connection:
              print('Owned server:', connection.execute(text("SELECT current_database(), current_setting('server_version'), host(inet_server_addr())")).one())
              connection.execute(text('CREATE DATABASE ocean_c23_reopen_diagnostic'))
          engine.dispose()
          PYTEST

      - name: Pin the independently owned PostgreSQL peer
        id: c23-postgres-identity
        env:
          POSTGRES_TEST_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          container_address="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$POSTGRES_TEST_CONTAINER_ID")"
          python -c 'import ipaddress, sys; ipaddress.IPv4Address(sys.argv[1])' "$container_address"
          printf 'address=%s\n' "$container_address" >> "$GITHUB_OUTPUT"

      - name: Run the exact focused native assertion with scheduled timer 120
        env:
          AUTH_MODE: disabled
          DEPLOYMENT_ENV: test
          RUN_C23_POSTGRES_INTEGRATION: "1"
          C23_TEST_DATABASE_URL: postgresql://ocean:integration-only-password@127.0.0.1:5432/ocean_c23_reopen_diagnostic
          C23_TEST_SERVER_ADDRESS: ${{ steps.c23-postgres-identity.outputs.address }}
          REOPEN_JUNIT: ${{ runner.temp }}/postgres-reopen-timer120.xml
        run: >-
          python -X faulthandler -m pytest
          tests/integration/test_experimental_artifact_postgres.py::test_native_pg_foreign_attachment_run_answer_revision_and_historical_reopen
          -x -vv -s --tb=short --durations=0
          -o faulthandler_timeout=120
          --junitxml="$REOPEN_JUNIT"

      - name: Require one actual native pass with zero skips
        if: always()
        env:
          REOPEN_JUNIT: ${{ runner.temp }}/postgres-reopen-timer120.xml
        run: |
          python - <<'PYTEST'
          import json
          import os
          import xml.etree.ElementTree as ET
          document = ET.parse(os.environ['REOPEN_JUNIT']).getroot()
          cases = list(document.iter('testcase'))
          expected = 'test_native_pg_foreign_attachment_run_answer_revision_and_historical_reopen'
          assert len(cases) == 1 and cases[0].get('name') == expected
          assert not any(cases[0].find(kind) is not None for kind in ['skipped', 'failure', 'error'])
          print(json.dumps({'native_case': expected, 'passed': 1, 'skipped': 0, 'scheduled_dump_seconds': 120}))
          PYTEST

