  postgres-acceptance:
    name: Complete PostgreSQL acceptance with timer zero
    needs: focused-timer0
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ocean
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_DB: ocean_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ocean -d ocean_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: 0f15bbcae3ad73ed76ddb32dd57b3a03dbedb49f

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/runtime.in
            requirements/runtime.txt
            requirements/dev.in
            requirements/dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/dev.txt

      - name: Apply application migrations
        env:
          DATABASE_URL: postgresql://ocean:integration-only-password@127.0.0.1:5432/ocean_platform
        run: python -m alembic upgrade head

      - name: Verify invite acceptance and metadata persistence
        env:
          AUTH_MODE: disabled
          DEPLOYMENT_ENV: test
          DATABASE_URL: postgresql://ocean:integration-only-password@127.0.0.1:5432/ocean_platform
          RUN_POSTGRES_INTEGRATION: "1"
        run: >-
          python -m pytest
          tests/integration/test_app_metadata_postgres.py
          tests/integration/test_classification_application_postgres.py
          tests/integration/test_classification_preview_postgres.py
          tests/integration/test_operational_postgres.py
          tests/integration/test_anemone_postgres.py
          tests/integration/test_anemone_catalogue_postgres.py
          tests/integration/test_edna_catalogue_postgres.py
          tests/integration/test_edna_aggregate_postgres.py
          tests/integration/test_edna_analysis_postgres.py
          tests/integration/test_chat_source_scope_postgres.py
          tests/integration/test_chat_filter_options_postgres.py
          tests/integration/test_research_registry_postgres.py
          -q

      - name: Verify transactional corpus upsert is idempotent
        env:
          DATABASE_URL: postgresql://ocean:integration-only-password@127.0.0.1:5432/ocean_platform
        run: |
          python scripts/load_db.py --upsert --json
          python scripts/load_db.py --upsert --json

      - name: Create isolated C03 retention test database
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          # This job owns the ephemeral service above; never inherit DATABASE_URL.
          engine = create_engine(
              "postgresql://ocean:integration-only-password@127.0.0.1:5432/ocean_platform",
              isolation_level="AUTOCOMMIT",
          )
          with engine.connect() as connection:
              connection.execute(text("CREATE DATABASE ocean_c03_retention_test"))
          engine.dispose()
          PY

      - name: Identify the job-owned PostgreSQL container address
        id: c03-postgres-identity
        env:
          POSTGRES_TEST_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          container_address="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$POSTGRES_TEST_CONTAINER_ID")"
          python -c 'import ipaddress, sys; ipaddress.IPv4Address(sys.argv[1])' "$container_address"
          printf 'address=%s\n' "$container_address" >> "$GITHUB_OUTPUT"

      - name: Verify C03 retention transaction ordering in isolated schemas
        env:
          AUTH_MODE: disabled
          DEPLOYMENT_ENV: test
          RUN_POSTGRES_INTEGRATION: "1"
          C03_TEST_DATABASE_URL: postgresql://ocean:integration-only-password@127.0.0.1:5432/ocean_c03_retention_test
          C03_TEST_SERVER_ADDRESS: ${{ steps.c03-postgres-identity.outputs.address }}
        run: >-
          python -m pytest tests/integration/test_retention_concurrency_postgres.py
          -q -s --tb=short

      - name: Create isolated C05 retrieval test database
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          # The URL and database are owned by this job, never inherited from the app.
          engine = create_engine(
              "postgresql://ocean:integration-only-password@127.0.0.1:5432/ocean_platform",
              isolation_level="AUTOCOMMIT",
          )
          with engine.connect() as connection:
              connection.execute(text("CREATE DATABASE ocean_c05_retrieval_test"))
          engine.dispose()
          engine = create_engine(
              "postgresql://ocean:integration-only-password@127.0.0.1:5432/ocean_c05_retrieval_test"
          )
          with engine.begin() as connection:
              connection.execute(text("CREATE EXTENSION vector"))
          engine.dispose()
          PY

      - name: Verify C05 vector identity and metagenome replacement history
