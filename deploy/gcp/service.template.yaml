apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ocean-platform
  labels:
    environment: prototype
    cost_component: serving
  annotations:
    run.googleapis.com/maxScale: "1"
spec:
  template:
    metadata:
      labels:
        environment: prototype
        cost_component: serving
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/cloudsql-instances: PROJECT_ID:REGION:CLOUD_SQL_INSTANCE
        run.googleapis.com/container-dependencies: '{"frontend":["api"]}'
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/secrets: 'ocean-auth-secret:projects/PROJECT_NUMBER/secrets/ocean-auth-secret,ocean-internal-auth-secret:projects/PROJECT_NUMBER/secrets/ocean-internal-auth-secret,ocean-oidc-client-secret:projects/PROJECT_NUMBER/secrets/ocean-oidc-client-secret,ocean-database-url:projects/PROJECT_NUMBER/secrets/ocean-database-url'
    spec:
      serviceAccountName: ocean-platform@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 20
      timeoutSeconds: 300
      containers:
        - name: frontend
          image: REGION-docker.pkg.dev/PROJECT_ID/ARTIFACT_REPOSITORY/frontend:IMAGE_TAG
          ports:
            - name: http1
              containerPort: 3000
          env:
            - name: API_BASE_URL
              value: http://127.0.0.1:8000
            - name: DEPLOYMENT_ENV
              value: production
            - name: AUTH_MODE
              value: required
            - name: ENABLE_MOCK_LOGIN
              value: "false"
            - name: AUTH_URL
              value: PUBLIC_APP_URL
            - name: AUTH_TRUST_HOST
              value: "true"
            - name: INTERNAL_AUTH_ISSUER
              value: ocean-platform-frontend
            - name: INTERNAL_AUTH_AUDIENCE
              value: ocean-platform-api
            - name: OIDC_PROVIDER_NAME
              value: OIDC_PROVIDER_NAME_VALUE
            - name: OIDC_PROVIDER_ID
              value: OIDC_PROVIDER_ID_VALUE
            - name: OIDC_ISSUER
              value: OIDC_ISSUER_VALUE
            - name: OIDC_CLIENT_ID
              value: OIDC_CLIENT_ID_VALUE
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: ocean-auth-secret
                  key: latest
            - name: INTERNAL_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: ocean-internal-auth-secret
                  key: latest
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ocean-oidc-client-secret
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: 512Mi

        - name: api
          image: REGION-docker.pkg.dev/PROJECT_ID/ARTIFACT_REPOSITORY/api:IMAGE_TAG
          env:
            - name: DEPLOYMENT_ENV
              value: production
            - name: AUTH_MODE
              value: required
            - name: PERSIST_LOCAL_CHAT
              value: "false"
            - name: ENABLE_MOCK_LOGIN
              value: "false"
            - name: AUTH_ALLOWED_PROVIDERS
              value: OIDC_PROVIDER_ID_VALUE
            - name: CORS_ORIGINS
              value: PUBLIC_APP_URL
            - name: INTERNAL_AUTH_ISSUER
              value: ocean-platform-frontend
            - name: INTERNAL_AUTH_AUDIENCE
              value: ocean-platform-api
            - name: DATA_DIR
              value: /mnt/ocean-data
            - name: SST_NETCDF_DIR
              value: /mnt/ocean-data/raw/sst-netcdf
            - name: HIMAWARI_RAW_DIR
              value: /mnt/ocean-data/raw/himawari
            - name: JOB_EXECUTION_MODE
              value: external
            - name: PROVENANCE_READ_MODE
              value: snapshot
            - name: PROVENANCE_SNAPSHOT_URI
              value: gs://DATA_BUCKET/provenance
            - name: PROVENANCE_CACHE_TTL_SECONDS
              value: "60"
            - name: DATABASE_POOL_SIZE
              value: "5"
            - name: DATABASE_MAX_OVERFLOW
              value: "2"
            - name: DATABASE_POOL_TIMEOUT
              value: "30"
            - name: DATABASE_POOL_RECYCLE
              value: "1800"
            - name: MODEL_PROVIDER
              value: vertex
            - name: GOOGLE_CLOUD_PROJECT
              value: PROJECT_ID
            - name: GOOGLE_CLOUD_LOCATION
              value: global
            - name: CHAT_MODEL
              value: gemini-3.6-flash
            - name: EMBEDDING_MODEL
              value: gemini-embedding-001
            - name: EMBEDDING_DIM
              value: "768"
            - name: CHAT_MAX_OUTPUT_TOKENS
              value: "1600"
            - name: VERTEX_THINKING_BUDGET
              value: "0"
            - name: MODEL_MAX_ATTEMPTS
              value: "3"
            - name: MODEL_RETRY_INITIAL_SECONDS
              value: "0.5"
            - name: MODEL_REQUEST_TIMEOUT_SECONDS
              value: "120"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ocean-database-url
                  key: latest
            - name: INTERNAL_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: ocean-internal-auth-secret
                  key: latest
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /health/live
              port: 8000
            failureThreshold: 12
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: scientific-data
              mountPath: /mnt/ocean-data

      volumes:
        - name: scientific-data
          csi:
            driver: gcsfuse.run.googleapis.com
            readOnly: true
            volumeAttributes:
              bucketName: DATA_BUCKET
