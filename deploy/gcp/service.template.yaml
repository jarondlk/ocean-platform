apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: onagawa-source-chat
  labels:
    environment: prototype
    cost_component: serving
  annotations:
    run.googleapis.com/maxScale: "1"
spec:
  template:
    metadata:
      labels:
        environment: prototype
        cost_component: serving
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/cloudsql-instances: PROJECT_ID:REGION:CLOUD_SQL_INSTANCE
        run.googleapis.com/container-dependencies: '{"frontend":["api"]}'
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/secrets: 'onagawa-auth-secret:projects/PROJECT_NUMBER/secrets/onagawa-auth-secret,onagawa-internal-auth-secret:projects/PROJECT_NUMBER/secrets/onagawa-internal-auth-secret,onagawa-oidc-client-secret:projects/PROJECT_NUMBER/secrets/onagawa-oidc-client-secret,onagawa-database-url:projects/PROJECT_NUMBER/secrets/onagawa-database-url'
    spec:
      serviceAccountName: onagawa-app@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 20
      timeoutSeconds: 300
      containers:
        - name: frontend
          image: REGION-docker.pkg.dev/PROJECT_ID/ARTIFACT_REPOSITORY/frontend:IMAGE_TAG
          ports:
            - name: http1
              containerPort: 3000
          env:
            - name: API_BASE_URL
              value: http://127.0.0.1:8000
            - name: DEPLOYMENT_ENV
              value: production
            - name: AUTH_MODE
              value: required
            - name: ENABLE_MOCK_LOGIN
              value: "false"
            - name: AUTH_URL
              value: PUBLIC_APP_URL
            - name: AUTH_TRUST_HOST
              value: "true"
            - name: INTERNAL_AUTH_ISSUER
              value: onagawa-source-chat-frontend
            - name: INTERNAL_AUTH_AUDIENCE
              value: onagawa-source-chat-api
            - name: OIDC_PROVIDER_NAME
              value: OIDC_PROVIDER_NAME_VALUE
            - name: OIDC_PROVIDER_ID
              value: OIDC_PROVIDER_ID_VALUE
            - name: OIDC_ISSUER
              value: OIDC_ISSUER_VALUE
            - name: OIDC_CLIENT_ID
              value: OIDC_CLIENT_ID_VALUE
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: onagawa-auth-secret
                  key: latest
            - name: INTERNAL_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: onagawa-internal-auth-secret
                  key: latest
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: onagawa-oidc-client-secret
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: 512Mi

        - name: api
          image: REGION-docker.pkg.dev/PROJECT_ID/ARTIFACT_REPOSITORY/api:IMAGE_TAG
          env:
            - name: DEPLOYMENT_ENV
              value: production
            - name: AUTH_MODE
              value: required
            - name: PERSIST_LOCAL_CHAT
              value: "false"
            - name: ENABLE_MOCK_LOGIN
              value: "false"
            - name: AUTH_ALLOWED_PROVIDERS
              value: OIDC_PROVIDER_ID_VALUE
            - name: CORS_ORIGINS
              value: PUBLIC_APP_URL
            - name: INTERNAL_AUTH_ISSUER
              value: onagawa-source-chat-frontend
            - name: INTERNAL_AUTH_AUDIENCE
              value: onagawa-source-chat-api
            - name: DATA_DIR
              value: /mnt/onagawa-data
            - name: JOB_EXECUTION_MODE
              value: external
            - name: DATABASE_POOL_SIZE
              value: "5"
            - name: DATABASE_MAX_OVERFLOW
              value: "2"
            - name: DATABASE_POOL_TIMEOUT
              value: "30"
            - name: DATABASE_POOL_RECYCLE
              value: "1800"
            - name: MODEL_PROVIDER
              value: ollama
            - name: OLLAMA_BASE_URL
              value: OLLAMA_PRIVATE_URL
            - name: CHAT_MODEL
              value: qwen2.5:14b-instruct
            - name: EMBEDDING_MODEL
              value: nomic-embed-text
            - name: EMBEDDING_DIM
              value: "768"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: onagawa-database-url
                  key: latest
            - name: INTERNAL_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: onagawa-internal-auth-secret
                  key: latest
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /health/live
              port: 8000
            failureThreshold: 12
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: scientific-data
              mountPath: /mnt/onagawa-data

      volumes:
        - name: scientific-data
          csi:
            driver: gcsfuse.run.googleapis.com
            readOnly: true
            volumeAttributes:
              bucketName: DATA_BUCKET
