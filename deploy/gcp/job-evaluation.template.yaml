apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: ocean-evaluation
  labels:
    environment: prototype
    cost_component: evaluation
spec:
  template:
    metadata:
      labels:
        environment: prototype
        cost_component: evaluation
      annotations:
        run.googleapis.com/cloudsql-instances: PROJECT_ID:REGION:CLOUD_SQL_INSTANCE
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/secrets: 'ocean-database-url:projects/PROJECT_NUMBER/secrets/ocean-database-url'
    spec:
      template:
        spec:
          serviceAccountName: ocean-jobs@PROJECT_ID.iam.gserviceaccount.com
          maxRetries: 0
          timeoutSeconds: "3600"
          containers:
            - image: REGION-docker.pkg.dev/PROJECT_ID/ARTIFACT_REPOSITORY/api:IMAGE_TAG
              command:
                - python
              args:
                - scripts/run_evaluation.py
                - --questions
                - ctd_01
                - --modes
                - Full
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: ocean-database-url
                      key: latest
                - name: DATA_DIR
                  value: /mnt/ocean-data
                - name: MODEL_PROVIDER
                  value: vertex
                - name: GOOGLE_CLOUD_PROJECT
                  value: PROJECT_ID
                - name: GOOGLE_CLOUD_LOCATION
                  value: global
                - name: CHAT_MODEL
                  value: gemini-3.6-flash
                - name: ALLOWED_CHAT_MODELS
                  value: gemini-3.6-flash
                - name: EMBEDDING_MODEL
                  value: gemini-embedding-001
                - name: ALLOWED_EMBEDDING_MODELS
                  value: gemini-embedding-001
                - name: EMBEDDING_DIM
                  value: "768"
                - name: CHAT_MAX_OUTPUT_TOKENS
                  value: "1600"
                - name: VERTEX_THINKING_BUDGET
                  value: "0"
                - name: MODEL_REQUEST_TIMEOUT_SECONDS
                  value: "120"
              resources:
                limits:
                  cpu: "2"
                  memory: 4Gi
              volumeMounts:
                - name: scientific-data
                  mountPath: /mnt/ocean-data
          volumes:
            - name: scientific-data
              csi:
                driver: gcsfuse.run.googleapis.com
                readOnly: false
                volumeAttributes:
                  bucketName: DATA_BUCKET
