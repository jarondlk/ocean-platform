apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: ocean-embedding
  labels:
    environment: prototype
    cost_component: embedding
spec:
  template:
    metadata:
      labels:
        environment: prototype
        cost_component: embedding
      annotations:
        run.googleapis.com/cloudsql-instances: PROJECT_ID:REGION:CLOUD_SQL_INSTANCE
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/secrets: 'ocean-database-url:projects/PROJECT_NUMBER/secrets/ocean-database-url'
    spec:
      template:
        spec:
          serviceAccountName: ocean-jobs@PROJECT_ID.iam.gserviceaccount.com
          maxRetries: 0
          timeoutSeconds: "1800"
          containers:
            - image: REGION-docker.pkg.dev/PROJECT_ID/ARTIFACT_REPOSITORY/api:IMAGE_TAG
              command:
                - python
              args:
                - scripts/update_embeddings.py
                - --batch-size
                - "32"
                - --dry-run
                - --limit
                - "16"
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: ocean-database-url
                      key: latest
                - name: MODEL_PROVIDER
                  value: vertex
                - name: GOOGLE_CLOUD_PROJECT
                  value: PROJECT_ID
                - name: GOOGLE_CLOUD_LOCATION
                  value: global
                - name: EMBEDDING_MODEL
                  value: gemini-embedding-001
                - name: EMBEDDING_DIM
                  value: "768"
                - name: MODEL_MAX_ATTEMPTS
                  value: "3"
                - name: MODEL_RETRY_INITIAL_SECONDS
                  value: "0.5"
                - name: MODEL_REQUEST_TIMEOUT_SECONDS
                  value: "120"
              resources:
                limits:
                  cpu: "1"
                  memory: 2Gi
