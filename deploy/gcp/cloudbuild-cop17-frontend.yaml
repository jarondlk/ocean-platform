# Frontend-only COP17 release. Reuse the accepted API digest for runtime checks.
# This builds/scans images; Cloud Run deployment is a separate explicit step.
steps:
  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args: [build, --build-arg, NEXT_PUBLIC_COP17_DEMO=true, -f, frontend/Containerfile, -t, ocean-candidate-frontend, -t, '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/frontend:candidate-${BUILD_ID}', frontend]
  - id: reuse-accepted-api
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    entrypoint: bash
    args:
      - -ceu
      - |
        docker pull '${_API_IMAGE}'
        docker tag '${_API_IMAGE}' ocean-candidate-api
  - id: runtime-smoke
    name: gcr.io/cloud-builders/docker
    waitFor: [build-frontend, reuse-accepted-api]
    entrypoint: bash
    args: [scripts/verify_candidate_containers.sh]
  - id: save-frontend
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: [-ceu, 'docker save ocean-candidate-frontend -o /workspace/candidate-frontend.tar']
  - id: scan-frontend
    name: aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c
    args: [image, --scanners, vuln, --format, json, --timeout, 10m, --exit-code, '0', --input, /workspace/candidate-frontend.tar, --output, /workspace/candidate-reports/frontend-scan.json]
# Exit 0 collects all findings; the report must be reviewed before deployment.
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/frontend:candidate-${BUILD_ID}'
artifacts:
  objects:
    location: 'gs://${PROJECT_ID}_cloudbuild/${_QA_REPORT_PREFIX}/${BUILD_ID}/'
    paths: [candidate-reports/*.json, candidate-reports/*.log]
substitutions:
  _REGION: asia-northeast1
  _REPOSITORY: ocean-platform
  _QA_REPORT_PREFIX: cop17-demo-frontend-qa
  _API_IMAGE: asia-northeast1-docker.pkg.dev/data-infra-infobio/ocean-platform/api@sha256:398e53b2dae64509263be64071af5f6cfaefd212b18a1c8e79f41c9c8c2797bb
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 2400s
