# Standalone production topology.
name: ocean-platform

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ocean_platform}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: Containerfile.api
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-2}
      DATABASE_POOL_TIMEOUT: ${DATABASE_POOL_TIMEOUT:-30}
      DATABASE_POOL_RECYCLE: ${DATABASE_POOL_RECYCLE:-1800}
      DATA_DIR: ${DATA_DIR:-/app/data}
      JOB_EXECUTION_MODE: ${JOB_EXECUTION_MODE:-local}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:?Set OLLAMA_BASE_URL}
      CHAT_MODEL: ${CHAT_MODEL:-qwen2.5:14b-instruct}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set the HTTPS frontend origin}
      DEPLOYMENT_ENV: production
      AUTH_MODE: required
      AUTH_ALLOWED_PROVIDERS: ${AUTH_ALLOWED_PROVIDERS:-oidc}
      PERSIST_LOCAL_CHAT: "false"
      ENABLE_MOCK_LOGIN: "false"
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:?Set INTERNAL_AUTH_SECRET}
      INTERNAL_AUTH_ISSUER: ${INTERNAL_AUTH_ISSUER:-ocean-platform-frontend}
      INTERNAL_AUTH_AUDIENCE: ${INTERNAL_AUTH_AUDIENCE:-ocean-platform-api}
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    volumes:
      - database_backups:/app/data/backups
      - pipeline_runs:/app/data/pipeline_runs
    command:
      - /bin/sh
      - -c
      - python scripts/bootstrap_database.py && exec uvicorn api.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ../../frontend
      dockerfile: Containerfile
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8000
      DEPLOYMENT_ENV: production
      AUTH_MODE: required
      ENABLE_MOCK_LOGIN: "false"
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:?Set the public HTTPS application URL}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-false}
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:?Set INTERNAL_AUTH_SECRET}
      INTERNAL_AUTH_ISSUER: ${INTERNAL_AUTH_ISSUER:-ocean-platform-frontend}
      INTERNAL_AUTH_AUDIENCE: ${INTERNAL_AUTH_AUDIENCE:-ocean-platform-api}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-Managed identity provider}
      OIDC_PROVIDER_ID: ${OIDC_PROVIDER_ID:-oidc}
      OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set OIDC_CLIENT_SECRET}
    ports:
      - "127.0.0.1:${NEXT_PORT:-3000}:3000"

volumes:
  pgdata:
  database_backups:
  pipeline_runs:
