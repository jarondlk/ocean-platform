# Development overlay for the FastAPI and Next.js application services.
services:
  api:
    build:
      context: .
      dockerfile: Containerfile.api
    container_name: onagawa_source_api
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://onagawa:onagawa@postgres:5432/onagawa_rag}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-2}
      DATABASE_POOL_TIMEOUT: ${DATABASE_POOL_TIMEOUT:-30}
      DATABASE_POOL_RECYCLE: ${DATABASE_POOL_RECYCLE:-1800}
      DATA_DIR: ${DATA_DIR:-/app/data}
      JOB_EXECUTION_MODE: ${JOB_EXECUTION_MODE:-local}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.containers.internal:11434}
      CHAT_MODEL: ${CHAT_MODEL:-qwen2.5:14b-instruct}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-development}
      AUTH_MODE: ${AUTH_MODE:-required}
      AUTH_ALLOWED_PROVIDERS: ${AUTH_ALLOWED_PROVIDERS:-oidc}
      PERSIST_LOCAL_CHAT: ${PERSIST_LOCAL_CHAT:-false}
      ENABLE_MOCK_LOGIN: ${ENABLE_MOCK_LOGIN:-false}
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:?Set INTERNAL_AUTH_SECRET in .env}
      INTERNAL_AUTH_ISSUER: ${INTERNAL_AUTH_ISSUER:-onagawa-source-chat-frontend}
      INTERNAL_AUTH_AUDIENCE: ${INTERNAL_AUTH_AUDIENCE:-onagawa-source-chat-api}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - .:/app:Z
    command:
      - /bin/sh
      - -c
      - python scripts/bootstrap_database.py && exec uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
    container_name: onagawa_source_frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-development}
      AUTH_MODE: ${AUTH_MODE:-required}
      ENABLE_MOCK_LOGIN: ${ENABLE_MOCK_LOGIN:-false}
      MOCK_VIEWER_PASSWORD_HASH: ${MOCK_VIEWER_PASSWORD_HASH:-}
      MOCK_RESEARCHER_PASSWORD_HASH: ${MOCK_RESEARCHER_PASSWORD_HASH:-}
      MOCK_ADMIN_PASSWORD_HASH: ${MOCK_ADMIN_PASSWORD_HASH:-}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:?Set INTERNAL_AUTH_SECRET in .env}
      INTERNAL_AUTH_ISSUER: ${INTERNAL_AUTH_ISSUER:-onagawa-source-chat-frontend}
      INTERNAL_AUTH_AUDIENCE: ${INTERNAL_AUTH_AUDIENCE:-onagawa-source-chat-api}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-Managed identity provider}
      OIDC_PROVIDER_ID: ${OIDC_PROVIDER_ID:-oidc}
      OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER in .env}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID in .env}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set OIDC_CLIENT_SECRET in .env}
    ports:
      - "${NEXT_PORT:-3000}:3000"
